name: Phase 2/3 regression and offline ML checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  independent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q src tests tools
      - name: Verify Phase 1 regression
        run: python tools/verify_phase1_docs.py
      - name: Run independent tests
        run: python -m pytest -q -m 'not postgres'

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Python integration dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Real PostgreSQL, API container and Alembic smoke checks
        shell: bash
        run: |
          set -euo pipefail
          export POSTGRES_HOST_PORT="${POSTGRES_HOST_PORT:-55487}"
          export DEV_POSTGRES_PASSWORD="$(python -c 'import secrets; print(secrets.token_hex(24))')"
          export COMPOSE_DATABASE_URL="postgresql+asyncpg://phase2:${DEV_POSTGRES_PASSWORD}@db:5432/phase2_dev"
          export DATABASE_URL="postgresql+asyncpg://phase2:${DEV_POSTGRES_PASSWORD}@127.0.0.1:${POSTGRES_HOST_PORT}/phase2_dev"
          export ENV_TYPE=test
          trap 'docker compose stop >/dev/null 2>&1 || true' EXIT
          docker compose config --quiet
          docker compose up -d --build
          published_db_port="$(docker compose port db 5432)"
          test "${published_db_port##*:}" = "$POSTGRES_HOST_PORT"
          ready=0
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready > /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1
          curl --fail --silent http://127.0.0.1:8000/health/live > /dev/null
          docker compose exec -T db psql -U phase2 -d phase2_dev -c "CREATE DATABASE phase2_test"
          export TEST_DATABASE_URL="postgresql+asyncpg://phase2:${DEV_POSTGRES_PASSWORD}@127.0.0.1:${POSTGRES_HOST_PORT}/phase2_test"
          python -m pytest -q -m postgres
          export DATABASE_URL="$TEST_DATABASE_URL"
          python -m alembic -c src/infrastructure/alembic/alembic.ini current
          python -m alembic -c src/infrastructure/alembic/alembic.ini upgrade head


  ml-independent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install offline ML dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-ml.txt
      - name: Compile Phase 3
        run: python -m compileall -q src tools tests
      - name: Offline baseline and data integrity tests with synthetic fixtures only
        run: |
          python -m pytest -q tests/test_text_preprocessor.py tests/test_dataset_preparation.py tests/test_prepare_dataset_cli.py tests/test_artifact_manifest.py tests/test_baseline_model.py tests/test_text_classifier_provider.py
